spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**, /api/users/**, /api/businesses/**
            - id: ingestion-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/uploads/**, /api/mapping-templates/**
            - id: attribution-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/channels/**, /api/metrics/**, /api/matches/**, /api/simulator/**, /api/settings/**
            - id: insights-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/insights/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

server:
  port: 8080