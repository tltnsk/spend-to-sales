spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: ${DB_USERNAME:spend}
    password: ${DB_PASSWORD:spend}
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    error:
      include-message: always

server:
  port: 8081
